[project]
name = "aegisai-bot"
version = "0.1.0"
description = "Professional Telegram Bot Framework"
requires-python = ">=3.13"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 88
target-version = "py314"